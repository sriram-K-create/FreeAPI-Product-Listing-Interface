<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
	:root {
		color-scheme: light;
	}

	body {
		font-family: 'Inter', sans-serif;
	}

	.glass-panel {
		background: rgba(255, 255, 255, 0.78);
		backdrop-filter: blur(18px);
		-webkit-backdrop-filter: blur(18px);
	}
</style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top,_#f8fafc,_#e2e8f0_40%,_#cbd5e1_100%)] text-slate-900">

<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
	<section class="glass-panel mb-8 overflow-hidden rounded-3xl border border-white/60 shadow-[0_20px_80px_rgba(15,23,42,0.12)]">
		<div class="grid gap-6 p-6 md:grid-cols-[1.6fr_1fr] md:p-8">
			<div>
				<p class="text-xs font-semibold uppercase tracking-[0.24em] text-sky-700">Live catalog snapshot</p>
				<h1 class="mt-3 text-3xl font-black tracking-tight text-slate-950 sm:text-5xl">E-Commerce Products</h1>
				<p class="mt-4 max-w-2xl text-sm leading-6 text-slate-600 sm:text-base">
					A product dashboard built from the API response, including rich metadata, discount signals, stock status, and the full image link set for every item.
				</p>
			</div>

			<div id="apiMeta" class="grid grid-cols-2 gap-3 text-sm"></div>
		</div>
	</section>

	<div id="productContainer" class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>
</main>

<script type="module" src="./js/main.js"></script>
</body>
</html>
